<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cursor Mover app icon - starting point built to assets/LOGO_BRIEF.md.
  1024x1024 artboard. Refine in Figma/Sketch, export PNG, then run make_icns.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Squircle container: corner radius ~22.5% of the canvas. -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Motion trail: dots grow and gain opacity along the path to the tip. -->
  <g fill="#FFFFFF">
    <circle cx="238" cy="236" r="16" opacity="0.30"/>
    <circle cx="295" cy="270" r="21" opacity="0.45"/>
    <circle cx="353" cy="306" r="26" opacity="0.62"/>
    <circle cx="408" cy="344" r="31" opacity="0.80"/>
  </g>

  <!--
    Classic macOS pointer: vertical left edge, sharp tip at the top left, and a
    notched tail at the bottom right. Drawn in 17x27 units, then scaled 14x.
  -->
  <g transform="translate(446 362) scale(14)">
    <path d="M0 0 L0 24 L6 18.5 L10 27 L14 25 L10 17 L17 17 Z"
          fill="#FFFFFF"
          stroke="#4338CA"
          stroke-opacity="0.25"
          stroke-width="0.5"
          stroke-linejoin="round"/>
  </g>
</svg>
