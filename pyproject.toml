[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-mover"
version = "1.1.0"
description = "A macOS menu bar app that keeps your Mac awake by nudging the cursor to a random position."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Aaquib Jawed" }]
keywords = ["macos", "menubar", "cursor", "keep-awake", "rumps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "pyautogui>=0.9.54",
    "rumps>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pillow>=10.0",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
cursor-mover = "cursor_mover.cli:main"

[project.urls]
Homepage = "https://github.com/iAaquibjawed/cursor-mover"
Issues = "https://github.com/iAaquibjawed/cursor-mover/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The menu and dialog copy intentionally uses en dashes and the × sign.
"src/cursor_mover/app.py" = ["RUF001"]
# PointerBackend mirrors pyautogui's camelCase API; FakeBackend must match it.
"src/cursor_mover/mover.py" = ["N802"]
"tests/*" = ["N802", "SLF001"]
