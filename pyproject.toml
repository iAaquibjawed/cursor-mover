[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-mover"
version = "2.0.0"
description = "A cross-platform tray app that keeps your computer awake by nudging the cursor to a random position."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Aaquib Jawed" }]
keywords = ["macos", "windows", "linux", "menubar", "tray", "cursor", "keep-awake", "mouse-jiggler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    # Pointer control on every platform. Pulls in Pillow, which the artwork
    # module and the tray icon also use.
    "pyautogui>=0.9.54",
    # macOS menu bar. AppKit-based, so it is macOS-only by construction.
    "rumps>=0.4.0; sys_platform == 'darwin'",
    # Windows and Linux system tray.
    "pystray>=0.19.5; sys_platform != 'darwin'",
    # X11 pointer control on Linux.
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
cursor-mover = "cursor_mover.cli:main"

[project.urls]
Homepage = "https://github.com/iAaquibjawed/cursor-mover"
Issues = "https://github.com/iAaquibjawed/cursor-mover/issues"

[project.gui-scripts]
cursor-mover-gui = "cursor_mover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The menu and dialog copy intentionally uses en dashes and the × sign.
# PointerBackend mirrors pyautogui's camelCase API; FakeBackend must match it.
"src/cursor_mover/mover.py" = ["N802"]
# Menu and dialog copy intentionally uses en dashes and arrows.
"src/cursor_mover/frontend/menubar.py" = ["RUF001", "RUF003"]
"src/cursor_mover/controller.py" = ["RUF001"]
"src/cursor_mover/systemui/applescript.py" = ["RUF001", "RUF002"]
"tests/*" = ["N802", "SLF001"]
