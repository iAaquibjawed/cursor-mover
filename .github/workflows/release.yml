name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for a manual re-run)
        required: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb libgirepository1.0-dev libcairo2-dev \
            gir1.2-ayatanaappindicator3-0.1 scrot

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          xvfb-run -a pytest

      - name: Check the version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(python -c 'import cursor_mover; print(cursor_mover.__version__)')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match cursor_mover.__version__ ($VERSION)."
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            command: ./packaging/build_macos.sh && ./packaging/create_dmg.sh
            artifact: dist/CursorMover-macOS.dmg
          - os: windows-latest
            label: Windows
            command: pwsh -File packaging/build_windows.ps1
            artifact: |
              dist/CursorMover-Windows.zip
              dist/CursorMover.exe
          - os: ubuntu-latest
            label: Linux
            command: ./packaging/build_linux.sh && ./packaging/build_deb.sh
            artifact: |
              dist/CursorMover-Linux-x86_64.tar.gz
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk libgirepository1.0-dev libcairo2-dev \
            gir1.2-ayatanaappindicator3-0.1 scrot dpkg-dev lintian

      - name: Install
        run: pip install -e ".[build]"

      - name: Build
        run: ${{ matrix.command }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: ${{ matrix.artifact }}

  apt-repo:
    name: Publish APT repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

      - uses: actions/download-artifact@v4
        with:
          name: release-Linux
          path: dist

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec:/ {print $5; exit}')" >> "$GITHUB_ENV"

      - name: Build the signed repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./packaging/build_apt_repo.sh

      - name: Add a landing page
        run: |
          VERSION="$(python3 -c "import re,pathlib;\
            print(re.search(r'__version__ = \"([^\"]+)\"',\
            pathlib.Path('src/cursor_mover/__init__.py').read_text()).group(1))")"
          sed "s/__VERSION__/$VERSION/g" packaging/apt-index.html > dist/apt/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apt

      - id: deploy
        uses: actions/deploy-pages@v4

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | macOS | `CursorMover-macOS.dmg` |
            | Windows | `CursorMover-Windows.zip` |
            | Linux (x86_64, X11) | `CursorMover-Linux-x86_64.tar.gz` |

            Installation notes for each platform are inside the download.

            These builds are **not** code-signed or notarized. macOS: right-click
            the app and choose Open. Windows: click "More info" then "Run anyway"
            at the SmartScreen prompt.

            Linux requires an X11 / Xorg session — Wayland does not permit
            applications to move the pointer.
