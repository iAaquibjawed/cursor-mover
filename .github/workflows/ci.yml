name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pyautogui and pystray need an X display and GTK bindings on Linux.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb libgirepository1.0-dev libcairo2-dev \
            gir1.2-ayatanaappindicator3-0.1 scrot

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The suite never opens a window, but pyautogui imports X libraries on
      # Linux, so it needs a display to import at all.
      - name: Test (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest --cov=cursor_mover --cov-report=term-missing

      - name: Test
        if: runner.os != 'Linux'
        run: pytest --cov=cursor_mover --cov-report=term-missing

      - name: Smoke test the CLI
        run: |
          cursor-mover --version
          cursor-mover --help

  build:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            command: ./packaging/build_macos.sh
            artifact: dist/CursorMover.app
          - os: windows-latest
            label: Windows
            command: pwsh -File packaging/build_windows.ps1
            artifact: dist/CursorMover.exe
          - os: ubuntu-latest
            label: Linux
            command: ./packaging/build_linux.sh && ./packaging/build_deb.sh
            artifact: |
              dist/cursor-mover
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk libgirepository1.0-dev libcairo2-dev \
            gir1.2-ayatanaappindicator3-0.1 scrot dpkg-dev lintian

      - name: Install
        run: pip install -e ".[build]"

      - name: Build
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: CursorMover-${{ matrix.label }}
          path: ${{ matrix.artifact }}

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: test
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # Catches the mistakes Flathub reviewers would catch: a malformed
      # manifest, missing AppStream fields, or a desktop file that does not
      # match the app id.
      - name: Validate AppStream metadata
        run: |
          appstreamcli validate --no-net \
            packaging/flatpak/io.github.iaaquibjawed.CursorMover.metainfo.xml

      - name: Validate the desktop entry
        run: |
          desktop-file-validate \
            packaging/flatpak/io.github.iaaquibjawed.CursorMover.desktop

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: cursor-mover.flatpak
          manifest-path: packaging/flatpak/io.github.iaaquibjawed.CursorMover.yml
          cache-key: flatpak-builder-${{ github.sha }}
