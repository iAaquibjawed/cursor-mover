name: Bug report
description: Something in Cursor Mover does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. On Linux, please check first that
        `echo $XDG_SESSION_TYPE` prints `x11` — Wayland does not allow
        applications to move the pointer, and that is not a bug we can fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Cursor Mover
        2. Click Change Interval and enter 30
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux (X11)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - Download from a release (DMG / zip / tarball)
        - From source (pip install -e .)
        - Built it myself
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: On Linux, please also name your desktop environment.
      placeholder: "macOS 15.1 / Windows 11 23H2 / Ubuntu 24.04 + GNOME"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Cursor Mover version
      description: From the About item in the menu, or `cursor-mover --version`.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: checkboxes
    id: environment-checks
    attributes:
      label: Checks
      options:
        - label: "macOS only: Cursor Mover is enabled under System Settings → Privacy & Security → Accessibility, and I relaunched afterwards"
        - label: "Linux only: `echo $XDG_SESSION_TYPE` prints `x11`, not `wayland`"
        - label: "Linux only: my desktop shows system tray icons (GNOME needs the AppIndicator extension)" 

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: If you can reproduce from source, paste the output of `cursor-mover --verbose`.
      render: shell
